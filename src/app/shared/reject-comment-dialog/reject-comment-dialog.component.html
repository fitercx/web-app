<h2 mat-dialog-title>Reject expiry change</h2>
<form [formGroup]="form" (ngSubmit)="submit()">
  <mat-dialog-content>
    <mat-form-field appearance="outline">
      <mat-label>Comment</mat-label>
      <textarea matInput rows="3" formControlName="comment" required></textarea>
      <mat-error *ngIf="form.get('comment')?.hasError('required')">A rejection requires a comment.</mat-error>
    </mat-form-field>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancel()">Cancel</button>
    <button mat-raised-button color="warn" type="submit">Reject</button>
  </mat-dialog-actions>
</form>
