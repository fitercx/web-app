<h2 mat-dialog-title>Add New {{ entityType }}</h2>

<mat-dialog-content>
  <form [formGroup]="buyerSupplierForm" fxLayout="column" fxLayoutGap="16px">
    <mat-form-field>
      <mat-label>{{ entityType }} Name *</mat-label>
      <input matInput formControlName="name" required />
      <mat-error *ngIf="buyerSupplierForm.get('name')?.hasError('required')">
        {{ entityType }} name is required
      </mat-error>
      <mat-error *ngIf="buyerSupplierForm.get('name')?.hasError('minlength')">
        {{ entityType }} name must be at least 2 characters
      </mat-error>
    </mat-form-field>

    <mat-form-field>
      <mat-label>Email</mat-label>
      <input matInput formControlName="email" type="email" />
      <mat-error *ngIf="buyerSupplierForm.get('email')?.hasError('email')">
        Please enter a valid email address
      </mat-error>
    </mat-form-field>

    <mat-form-field>
      <mat-label>Phone Number</mat-label>
      <input matInput formControlName="phoneNumber" />
    </mat-form-field>

    <mat-form-field>
      <mat-label>Address</mat-label>
      <textarea matInput formControlName="address" rows="3"></textarea>
    </mat-form-field>

    <mat-form-field>
      <mat-label>Tax ID</mat-label>
      <input matInput formControlName="taxId" />
    </mat-form-field>

    <mat-form-field>
      <mat-label>Description</mat-label>
      <textarea matInput formControlName="description" rows="2"></textarea>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()" [disabled]="isLoading">Cancel</button>
  <button mat-raised-button color="primary" (click)="onSubmit()" [disabled]="!buyerSupplierForm.valid || isLoading">
    <span *ngIf="isLoading">Adding...</span>
    <span *ngIf="!isLoading">Add {{ entityType }}</span>
  </button>
</mat-dialog-actions>
